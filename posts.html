---
layout: default
title: All Posts
---
<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>All Blog Posts - Rabindra Nath Nandi</title>
  <link rel="stylesheet" href="jemdoc.css" type="text/css" />
  <style>
    body {
      background: linear-gradient(135deg, #e0e7ff 0%, #f8fafc 100%);
      font-family: 'Segoe UI', Arial, sans-serif;
      color: #222;
      margin: 0;
      padding: 0;
    }
    .container {
      max-width: 1100px;
      margin: 0 auto;
      padding: 0 18px 48px 18px;
    }
    header {
      text-align: center;
      padding: 48px 0 24px 0;
    }
    h1 {
      color: #6366f1;
      font-size: 2.3em;
      font-weight: 700;
      margin-bottom: 8px;
    }
    .subtitle {
      color: #6366f1;
      font-size: 1.18em;
      font-weight: 500;
      margin-bottom: 10px;
    }
    .section-title {
      color: #6366f1;
      font-size: 1.4em;
      border-left: 5px solid #6366f1;
      padding-left: 12px;
      margin-bottom: 18px;
      margin-top: 0;
    }
    .posts-grid {
      display: grid;
      grid-template-columns: repeat(auto-fit, minmax(320px, 1fr));
      gap: 24px;
      margin-top: 24px;
    }
    .post-card {
      background: #fff;
      border-radius: 14px;
      box-shadow: 0 2px 8px rgba(99,102,241,0.07);
      padding: 24px 28px 18px 28px;
      display: flex;
      flex-direction: column;
      justify-content: space-between;
      min-height: 180px;
    }
    .post-title {
      font-size: 1.18em;
      font-weight: 600;
      color: #374151;
      margin-bottom: 6px;
      text-decoration: none;
      transition: color 0.2s;
    }
    .post-title:hover {
      color: #6366f1;
      text-decoration: underline;
    }
    .post-date {
      color: #888;
      font-size: 0.98em;
      margin-bottom: 10px;
    }
    .post-excerpt {
      color: #444;
      font-size: 1.03em;
      margin-bottom: 0;
    }
    @media (max-width: 700px) {
      .container {
        padding: 0 2vw 32px 2vw;
      }
      .posts-grid {
        grid-template-columns: 1fr;
      }
      .post-card {
        padding: 16px 10px 14px 10px;
      }
    }
  </style>
</head>
<body>
  <div class="container">
    <header>
      <h1>All Blog Posts</h1>
      <div class="subtitle">Rabindra Nath Nandi</div>
    </header>
    <div class="section-title">Posts</div>
    <div class="posts-grid">
      {% for post in site.posts %}
      <div class="post-card">
        <a class="post-title" href="{{ post.url }}">{{ post.title }}</a>
        <div class="post-date">{{ post.date | date: "%b %d, %Y" }}</div>
        <div class="post-excerpt">{{ post.excerpt }}</div>
      </div>
      {% endfor %}
    </div>
  </div>
</body>
</html>
