---
layout: default
title: All Posts
---

<h1>All Blog Posts</h1>
<ul>
  {% for post in site.posts %}
    <li>
      <a href="{{ post.url }}">{{ post.title }}</a>
      <span style="color:#888;">({{ post.date | date: "%b %d, %Y" }})</span>
      <p>{{ post.excerpt }}</p>
    </li>
  {% endfor %}
</ul>
